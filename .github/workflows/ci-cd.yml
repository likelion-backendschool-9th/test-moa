name: CI/CD

# PR(→ develop, main): 검사만 한다
# develop에 push(머지): 검사를 다시 돌리고, 통과하면 이미지를 만들어 GHCR에 올린다
# main은 지금 배포하지 않는다 (운영 단계에서 추가)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 검사는 취소한다. develop push는 취소하지 않고 순서대로 돈다
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- CI: 검사 ----

  frontend:
    name: Frontend lint·build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3005
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # @SpringBootTest가 DB에 연결하므로 테스트용 Postgres를 함께 띄운다
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: testmoa
          POSTGRES_USER: testmoa
          POSTGRES_PASSWORD: testmoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testmoa -d testmoa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle 배포판과 의존성을 캐시한다
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testmoa
          SPRING_DATASOURCE_USERNAME: testmoa
          SPRING_DATASOURCE_PASSWORD: testmoa

  # PR에서만: 운영 이미지가 빌드되는지 확인하고 올리지 않는다
  docker:
    name: Docker build (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3005
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---- CD: 이미지 빌드·푸시 ----

  # develop에 push됐고 검사를 통과했을 때만
  build-push:
    name: Build·push image (${{ matrix.service }})
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN으로 GHCR에 이미지를 올린다
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # 프론트 이미지에는 접속 주소가 빌드할 때 들어가므로, 비어 있으면 여기서 멈춘다
      # 값은 Settings → Secrets and variables → Actions → Variables에 둔다
      - name: Check NEXT_PUBLIC_SITE_URL
        if: matrix.service == 'frontend'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::저장소 변수 NEXT_PUBLIC_SITE_URL이 비어 있습니다"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그: sha-<커밋 7자리>(배포·롤백용), develop(가장 최근 이미지)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/test-moa-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=develop

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---- CD: 배포 ----
  # 서버 접속 방식(self-hosted runner 또는 SSH)이 정해지면 build-push 뒤에 deploy job을 추가한다
