name: CI

# develop·main으로 오는 PR을 머지해도 되는지 검사한다. 배포는 하지 않는다
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint·build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3005
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # @SpringBootTest가 DB에 연결하므로 테스트용 Postgres를 함께 띄운다
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: testmoa
          POSTGRES_USER: testmoa
          POSTGRES_PASSWORD: testmoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testmoa -d testmoa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle 배포판과 의존성을 캐시한다
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testmoa
          SPRING_DATASOURCE_USERNAME: testmoa
          SPRING_DATASOURCE_PASSWORD: testmoa

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 운영 이미지(runner 스테이지)가 빌드되는지만 확인하고 올리지 않는다
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3005
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
