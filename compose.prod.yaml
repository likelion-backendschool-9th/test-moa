# 운영 서버용: 빌드하지 않고 GHCR에서 받은 이미지로 띄운다
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
# 서버에는 이 파일, nginx/default.conf, .env만 있으면 된다
# 환경 변수는 셸이나 같은 폴더의 .env에서 읽는다
# 필요한 값: IMAGE_TAG, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# NEXT_PUBLIC_SITE_URL은 프론트 이미지를 빌드할 때 들어가므로 여기서는 받지 않는다
services:
  db:
    image: postgres:17
    container_name: test-moa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 백엔드가 DB 준비가 끝난 뒤에 뜨도록 상태를 확인한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # IMAGE_TAG로 배포할 버전(커밋 SHA 등)을 고른다. 이전 태그로 바꾸면 롤백이 된다
    image: ghcr.io/likelion-backendschool-9th/test-moa-backend:${IMAGE_TAG}
    container_name: test-moa-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/likelion-backendschool-9th/test-moa-frontend:${IMAGE_TAG}
    container_name: test-moa-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # 외부 요청은 nginx 하나로만 받아 프론트엔드(BFF)로 넘긴다
  nginx:
    image: nginx:stable-alpine
    container_name: test-moa-nginx
    restart: unless-stopped
    ports:
      - "3005:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

volumes:
  db-data:
