name: PR meta

# PR 템플릿은 라벨·담당자를 정할 수 없어서, PR을 열 때 여기서 붙인다
on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write   # PR 라벨은 이슈 API로 붙는다

jobs:
  meta:
    runs-on: ubuntu-latest
    # 본문만 고친 edited는 건너뛰고, 제목을 고쳤을 때만 라벨을 다시 본다
    if: ${{ github.event.action != 'edited' || github.event.changes.title != null }}
    steps:
      - name: Assign author and label by title type
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          # 제목은 명령에 끼워 넣지 않고 환경 변수로만 읽는다
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # 봇이 연 PR은 담당자로 넣을 수 없다
          if [ "$AUTHOR_TYPE" != "Bot" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-assignee "$AUTHOR"
          fi

          # README의 커밋 유형과 기존 라벨을 맞춘다. 맞는 라벨이 없는 유형은 붙이지 않는다
          case "$TITLE" in
            Feat:*|Design:*) label=enhancement ;;
            Fix:*)           label=bug ;;
            Docs:*)          label=documentation ;;
            *)               label="" ;;
          esac

          # 붙이기만 하고 지우지 않는다. 사람이 직접 붙인 라벨은 그대로 둔다
          if [ -n "$label" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "$label"
          fi
