# WebSocket 요청이면 Connection 헤더를 upgrade로, 아니면 비워서 넘긴다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # 배포로 frontend 컨테이너 IP가 바뀌어도 따라가도록 Docker 내부 DNS로 이름을 10초마다 다시 찾는다
    # frontend가 아직 안 떠 있어도 nginx는 종료되지 않고 그동안만 502를 준다
    resolver 127.0.0.11 valid=10s;

    # 이미지 업로드를 받을 수 있게 기본값(1m)보다 크게 둔다
    client_max_body_size 10m;

    # SSE는 즉시 전달하고 앞단 nginx에도 버퍼링 해제 헤더를 넘긴다
    location = /api/chats/events {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 변수로 넘겨야 시작할 때 한 번이 아니라 요청마다 resolver로 이름을 찾는다
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;

        # Next가 원래 요청한 주소와 클라이언트 IP를 알 수 있게 넘긴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 서버의 HMR(WebSocket) 연결도 통과시킨다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
