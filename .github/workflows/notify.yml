name: Notify Campfire

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]          # PR이 향하는(base) 브랜치 기준
    types: [opened, reopened, closed]  # closed는 merge된 경우만 알림

permissions:
  contents: read
  pull-requests: read

jobs:
  push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.event.head_commit != null }}   # 브랜치 삭제 push는 스킵
    steps:
      - name: Send push notification to Campfire
        env:
          WEBHOOK_URL:  ${{ secrets.CAMPFIRE_WEBHOOK_URL }}
          GH_TOKEN:     ${{ github.token }}
          REPO:         ${{ github.repository }}
          BRANCH:       ${{ github.ref_name }}
          ACTOR:        ${{ github.actor }}
          AVATAR:       ${{ github.event.sender.avatar_url }}
          COMPARE_URL:  ${{ github.event.compare }}
          HEAD_SHA:     ${{ github.event.head_commit.id }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          COUNT=$(printf '%s' "$COMMITS_JSON" | jq 'length')
          # 새 커밋 없이 브랜치만 만든 push는 스킵
          if [ "$COUNT" -eq 0 ]; then echo "no new commits - skip"; exit 0; fi
          # PR merge로 생긴 push는 merge 알림과 겹치므로 스킵
          MERGED=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .base.ref == \"$BRANCH\")] | length")
          if [ "$MERGED" -gt 0 ]; then echo "push from PR merge - skip"; exit 0; fi
          TEXT=$(printf '%s' "$COMMITS_JSON" | jq -r '
            .[0:10][]
            | "[`" + .id[0:7] + "`](" + .url + ") "
              + (.message | split("\n")[0]) + " — " + .author.name')
          if [ "$COUNT" -gt 10 ]; then TEXT="$TEXT"$'\n'"…및 $((COUNT - 10))개 더"; fi
          PAYLOAD=$(jq -n \
            --arg title "[$REPO:$BRANCH] $COUNT new commit(s)" \
            --arg link "$COMPARE_URL" --arg author "$ACTOR" \
            --arg icon "$AVATAR" --arg text "$TEXT" \
            '{attachments:[{color:"#0969da",author_name:$author,author_icon:$icon,
              title:$title,title_link:$link,text:$text}]}')
          curl -sS --fail-with-body -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" -d "$PAYLOAD"

  pull_request:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged) }}
    steps:
      - name: Send PR / merge notification to Campfire
        env:
          WEBHOOK_URL: ${{ secrets.CAMPFIRE_WEBHOOK_URL }}
          REPO:        ${{ github.repository }}
          ACTION:      ${{ github.event.action }}
          MERGED:      ${{ github.event.pull_request.merged }}
          NUMBER:      ${{ github.event.pull_request.number }}
          PR_TITLE:    ${{ github.event.pull_request.title }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          HEAD:        ${{ github.event.pull_request.head.ref }}
          BASE:        ${{ github.event.pull_request.base.ref }}
          AUTHOR:      ${{ github.event.pull_request.user.login }}
          AVATAR:      ${{ github.event.pull_request.user.avatar_url }}
          MERGED_BY:   ${{ github.event.pull_request.merged_by.login }}
        run: |
          set -euo pipefail
          if [ "$MERGED" = "true" ]; then
            TITLE="[$REPO] PR #$NUMBER merged: $HEAD → $BASE"
            TEXT="$PR_TITLE — merged by $MERGED_BY"
            COLOR="#8250df"
          else
            TITLE="[$REPO] PR #$NUMBER $ACTION: $HEAD → $BASE"
            TEXT="$PR_TITLE"
            COLOR="#1a7f37"
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --arg link "$PR_URL" \
            --arg author "$AUTHOR" --arg icon "$AVATAR" \
            --arg text "$TEXT" --arg color "$COLOR" \
            '{attachments:[{color:$color,author_name:$author,author_icon:$icon,
              title:$title,title_link:$link,text:$text}]}')
          curl -sS --fail-with-body -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" -d "$PAYLOAD"
