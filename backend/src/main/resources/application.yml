spring:
  application:
    name: backend

  profiles:
    # 실행 환경. local이면 application-local.yml 설정을 함께 읽음
    active: local

  jpa:
    hibernate:
      naming:
        # 필드명(camelCase)을 컬럼명(snake_case)으로 자동 변환. 예) imageUrl -> image_url
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl

jwt:
  # 서명 키(HS256). 32바이트 이상. 값은 환경 변수 JWT_SECRET으로만 넘기고 커밋하지 않는다
  secret: ${JWT_SECRET}
  # access 토큰 유효 시간. 환경 변수 JWT_ACCESS_TOKEN_TTL로 바꿀 수 있고(예: 1m), 없으면 30분
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  # refresh 토큰 유효 시간. 이 기간 동안 다시 로그인하지 않아도 된다. 환경 변수 JWT_REFRESH_TOKEN_TTL, 없으면 14일
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}

cashout:
  # 출금 계좌·예금주 AES-256 키. Base64로 인코딩한 32바이트. 환경 변수만 쓰고 커밋하지 않는다
  account-crypto-key: ${CASHOUT_ACCOUNT_CRYPTO_KEY}

# 소셜 로그인(OAuth) 앱 값. 환경 변수로만 넘기고 커밋하지 않는다. 비어 있으면 그 제공자로 로그인할 때 실패한다
# 내 컴퓨터에서는 backend/config/application-local.yml(커밋하지 않음)에 같은 이름으로 넣어도 된다
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
