# 서버용 팀 nginx 설정 (compose.prod.yaml의 nginx 서비스가 쓴다)
#
# 인터넷 → 호스트 nginx (팀 도메인, 443, certbot 인증서)
#        → http://127.0.0.1:${TEAM_PORT} (이 nginx, 80)
#        → http://frontend:3000
#
# HTTPS는 호스트 nginx가 끝냈으므로 여기는 80만 듣는다
# 호스트 nginx가 넘겨 준 X-Forwarded-* 헤더를 그대로 frontend에 전달한다
# 로컬에서는 이 nginx가 맨 앞이라 default.conf를 쓴다

# 배포로 frontend 컨테이너 IP가 바뀌어도 따라가도록 Docker 내부 DNS로 이름을 10초마다 다시 찾는다
# frontend가 아직 안 떠 있어도 nginx는 종료되지 않고 그동안만 502를 준다
resolver 127.0.0.11 valid=10s;

# 지금은 frontend 하나지만 블루그린 배포 때 server 줄만 바꿔 트래픽을 옮기도록 upstream으로 나눈다
upstream frontend_upstream {
    # resolve로 이름을 다시 찾으려면 공유 메모리 zone이 필요하다
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    server_name _;

    # 이미지 업로드를 받을 수 있게 기본값(1m)보다 크게 둔다
    client_max_body_size 10m;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;
    }
}
