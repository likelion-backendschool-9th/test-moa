# 전체 서비스를 한 번에 띄운다: docker compose up --build
# 환경 변수는 셸이나 같은 폴더의 .env에서 읽는다
# 필요한 값: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, JWT_SECRET, NEXT_PUBLIC_SITE_URL, TEAM_PORT
# 선택 값: ANALYSIS_BASE_URL, ANALYSIS_INTERNAL_TOKEN (AI 분석 서버. 없으면 AI 기능만 503)
# 로컬 HTTPS(--profile https)를 쓸 때: HTTP_PORT, HTTPS_PORT
services:
  db:
    image: postgres:17
    container_name: test-moa-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 백엔드가 DB 준비가 끝난 뒤에 뜨도록 상태를 확인한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # adminer:
  #   image: adminer
  #   container_name: test-moa-adminer
  #   environment:
  #     # 로그인 화면의 서버 칸에 db를 미리 채운다
  #     ADMINER_DEFAULT_SERVER: db
  #   ports:
  #     - "{}:8080"
  #   depends_on:
  #     - db

  backend:
    build: ./backend
    container_name: test-moa-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 엔티티를 보고 테이블을 만들고 바뀐 컬럼을 더한다(지우지는 않음)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ANALYSIS_BASE_URL: ${ANALYSIS_BASE_URL:-http://localhost:8000}
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: test-moa-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      - backend

  # 외부 요청은 nginx 하나로만 받아 프론트엔드(BFF)로 넘긴다
  nginx:
    image: nginx:stable-alpine
    container_name: test-moa-nginx
    ports:
      # 우리 팀에 배정된 포트
      - "${TEAM_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

  # 로컬 HTTPS: docker compose --profile https up 할 때만 뜬다
  # 인증서 만드는 방법은 nginx/https.conf 맨 위 주석 참고
  nginx-https:
    image: nginx:stable-alpine
    container_name: test-moa-nginx-https
    profiles: [https]
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend

volumes:
  db-data:
