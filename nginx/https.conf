# 로컬 HTTPS용 (docker compose --profile https up). 운영 서버에서는 쓰지 않는다
# 인증서는 mkcert로 만들어 nginx/certs/에 둔다 (커밋하지 않는다)
#   mkcert -install
#   mkcert -cert-file nginx/certs/local.pem -key-file nginx/certs/local-key.pem localhost 127.0.0.1 ::1

# WebSocket 요청이면 Connection 헤더를 upgrade로, 아니면 비워서 넘긴다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# HTTP로 들어오면 HTTPS로 보낸다
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    # frontend 컨테이너 IP가 바뀌어도 따라가도록 Docker 내부 DNS로 이름을 10초마다 다시 찾는다
    resolver 127.0.0.11 valid=10s;

    # 이미지·신고 증거 업로드를 받을 수 있게 기본값(1m)보다 크게 둔다. 한 장 5MB × 5장(Spring max-request-size 30MB)
    client_max_body_size 30m;

    # SSE는 즉시 전달하고 앞단 nginx에도 버퍼링 해제 헤더를 넘긴다
    location = /api/chats/events {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 변수로 넘겨야 요청마다 resolver로 이름을 찾는다
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;

        # Next가 원래 요청한 주소와 클라이언트 IP, https 여부를 알 수 있게 넘긴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 서버의 HMR(WebSocket) 연결도 통과시킨다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
