# 개발 모드: docker compose up을 하면 compose.yaml 위에 이 파일이 자동으로 겹쳐진다
# 운영 설정만 쓰려면 파일을 직접 지정한다: docker compose -f compose.yaml up --build
services:
  backend:
    build:
      target: dev
    volumes:
      # 소스를 붙여 컨테이너를 다시 시작하면 고친 내용으로 뜨게 한다: docker compose restart backend
      - ./backend:/app
      # 빌드 결과와 Gradle 프로젝트 캐시가 호스트 폴더에 섞이지 않게 따로 둔다
      - /app/build
      - /app/.gradle
      # 받은 Gradle과 라이브러리를 남겨 컨테이너를 다시 만들어도 다시 받지 않게 한다
      - gradle-cache:/root/.gradle

  frontend:
    build:
      target: dev
    environment:
      # 개발 서버는 실행 중에 코드를 빌드하므로 NEXT_PUBLIC_ 값도 실행할 때 넘긴다
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # macOS의 바인드 마운트에서 파일 변경을 놓치지 않게 폴링으로 감시한다
      WATCHPACK_POLLING: "true"
    volumes:
      # 소스를 붙여 고친 내용이 바로 반영되게 한다
      - ./frontend:/app
      # 호스트(macOS)의 node_modules와 .next가 컨테이너(Linux) 것을 덮지 않게 따로 둔다
      - /app/node_modules
      - /app/.next

volumes:
  gradle-cache:
