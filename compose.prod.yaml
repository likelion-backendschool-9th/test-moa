# 운영 서버용: 빌드하지 않고 GHCR에서 받은 이미지로 띄운다
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
# 서버에는 이 파일, nginx/server.conf, .env만 있으면 된다
# 환경 변수는 셸이나 같은 폴더의 .env에서 읽는다
# 필요한 값: GITHUB_OWNER, IMAGE_TAG, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, COMPOSE_PROJECT_NAME, TEAM_PORT,
#            JWT_SECRET, CASHOUT_ACCOUNT_CRYPTO_KEY, ANALYSIS_INTERNAL_TOKEN, ANALYSIS_ANTHROPIC_API_KEY
# 값이 비었거나 없으면 :? 검사로 기동하지 않고 어떤 값이 빠졌는지 알려 준다
# 선택 값: KAKAOPAY_SECRET_KEY, KAKAOPAY_CID, TOSSPAYMENTS_CLIENT_KEY, TOSSPAYMENTS_SECRET_KEY, PAYMENT_RETURN_BASE_URL (구독 현금 결제. 비우면 그 결제 수단만 막힌다)
# NEXT_PUBLIC_SITE_URL은 프론트 이미지를 빌드할 때 들어가므로 여기서는 받지 않는다
# 다른 팀과 같은 서버를 쓰므로 COMPOSE_PROJECT_NAME으로 네트워크·볼륨 이름을 팀별로 나눈다
# container_name은 두지 않는다. 컨테이너 이름은 <COMPOSE_PROJECT_NAME>-<서비스>-<번호>로 붙고,
# 블루그린 배포처럼 같은 서비스를 두 개 띄울 때 이름이 겹치지 않는다

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 백엔드가 DB 준비가 끝난 뒤에 뜨도록 상태를 확인한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # IMAGE_TAG로 배포할 버전(커밋 SHA 등)을 고른다. 이전 태그로 바꾸면 롤백이 된다
    image: ghcr.io/${GITHUB_OWNER:?GITHUB_OWNER를 .env에 설정하세요}/test-moa-backend:${IMAGE_TAG:?IMAGE_TAG를 .env에 설정하세요}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      CASHOUT_ACCOUNT_CRYPTO_KEY: ${CASHOUT_ACCOUNT_CRYPTO_KEY:?CASHOUT_ACCOUNT_CRYPTO_KEY를 .env에 설정하세요}
      # 소셜 로그인(OAuth) 앱 값. 없으면 소셜 로그인만 실패하고 나머지는 그대로 돈다
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # 구독 현금 결제(카카오페이·토스 테스트). 없으면 그 결제 수단만 쓸 수 없고 나머지는 그대로 돈다
      KAKAOPAY_SECRET_KEY: ${KAKAOPAY_SECRET_KEY:-}
      KAKAOPAY_CID: ${KAKAOPAY_CID:-}
      TOSSPAYMENTS_CLIENT_KEY: ${TOSSPAYMENTS_CLIENT_KEY:-}
      TOSSPAYMENTS_SECRET_KEY: ${TOSSPAYMENTS_SECRET_KEY:-}
      # 결제 뒤 돌아올 사이트 주소(서버 .env에 사이트 주소를 넣는다). 비어 있으면 현금 결제를 쓸 수 없다
      PAYMENT_RETURN_BASE_URL: ${PAYMENT_RETURN_BASE_URL:-}
      # 엔티티를 보고 테이블을 만들고 바뀐 컬럼을 더한다(지우지는 않음). 실제 서비스 전에 Flyway 같은 마이그레이션으로 바꾼다
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # AI 분석 서버(analysis). 같은 compose 네트워크 안에서 서비스 이름으로 부른다
      ANALYSIS_BASE_URL: http://analysis:8000
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN을 .env에 설정하세요}
      # 올린 파일(신고 증거 등)을 두는 폴더. 볼륨이라 컨테이너를 다시 만들어도 남는다
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # AI 분석 서버(Claude 호출). 포트를 열지 않아 같은 compose 네트워크의 backend만 부를 수 있다
  # Anthropic API 키는 이미지에 넣지 않고 실행할 때 .env에서만 받는다
  # 분석 서버가 죽어도 backend는 AI 기능만 503이고 나머지는 그대로 뜨므로 backend의 depends_on에는 넣지 않는다
  analysis:
    image: ghcr.io/${GITHUB_OWNER:?GITHUB_OWNER를 .env에 설정하세요}/test-moa-analysis:${IMAGE_TAG:?IMAGE_TAG를 .env에 설정하세요}
    restart: unless-stopped
    environment:
      # backend와 같은 값. 32자 이상 (X-Internal-Token으로 서로 확인한다)
      ANALYSIS_INTERNAL_TOKEN: ${ANALYSIS_INTERNAL_TOKEN:?ANALYSIS_INTERNAL_TOKEN을 .env에 설정하세요}
      ANALYSIS_ANTHROPIC_API_KEY: ${ANALYSIS_ANTHROPIC_API_KEY:?ANALYSIS_ANTHROPIC_API_KEY를 .env에 설정하세요}
    read_only: true            # 컨테이너 파일시스템 쓰기 금지 (침입 시 피해 축소)
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512m         # 넘으면 이 컨테이너만 재시작

  frontend:
    image: ghcr.io/${GITHUB_OWNER:?GITHUB_OWNER를 .env에 설정하세요}/test-moa-frontend:${IMAGE_TAG:?IMAGE_TAG를 .env에 설정하세요}
    restart: unless-stopped
    environment:
      AUTH_MODE: backend
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  # 외부 요청은 nginx 하나로만 받아 프론트엔드(BFF)로 넘긴다
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      # 서버에서 우리 팀에 배정된 포트
      # 같은 서버의 외부 nginx만 접근하도록 127.0.0.1에만 연다. 밖에서는 도메인으로만 들어온다
      - "127.0.0.1:${TEAM_PORT:?TEAM_PORT를 .env에 설정하세요}:80"
    volumes:
      # 호스트 nginx 뒤에 서므로 X-Forwarded-*를 그대로 넘기는 서버용 설정을 쓴다
      - ./nginx/server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

volumes:
  db-data:
  upload-data:
