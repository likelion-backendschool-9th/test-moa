# 로컬 HTTPS용 (docker compose --profile https up). 운영 서버에서는 쓰지 않는다
# 인증서는 mkcert로 만들어 nginx/certs/에 둔다 (커밋하지 않는다)
#   mkcert -install
#   mkcert -cert-file nginx/certs/local.pem -key-file nginx/certs/local-key.pem localhost 127.0.0.1 ::1

# WebSocket 요청이면 Connection 헤더를 upgrade로, 아니면 비워서 넘긴다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream frontend {
    # compose 내부망에서 서비스 이름으로 찾는다
    server frontend:3000;
}

# HTTP로 들어오면 HTTPS로 보낸다
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    # 이미지 업로드를 받을 수 있게 기본값(1m)보다 크게 둔다
    client_max_body_size 10m;

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Next가 원래 요청한 주소와 클라이언트 IP, https 여부를 알 수 있게 넘긴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 개발 서버의 HMR(WebSocket) 연결도 통과시킨다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
