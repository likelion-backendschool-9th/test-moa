name: Frontend visual

# 화면 비교 (#160-R2). 기준 커밋과 이 브랜치를 같은 Linux 환경에서 찍어 픽셀 단위로 비교한다.
# 빌드를 두 번 하므로 PR마다 돌리지 않고 필요할 때 수동으로 실행한다.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 기준 커밋 또는 브랜치
        default: origin/develop
        required: true

jobs:
  visual:
    name: Frontend visual compare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run test:visual -- --base "${{ inputs.base }}"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: frontend/test-results/visual/
